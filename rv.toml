[package]
name = "dusk"
version = "0.1.0"
edition = "v3"

[dependencies]
"github.com/martian56/plumage" = "v0.5.2"
"github.com/martian56/perch" = "v0.4.0"
"github.com/martian56/wingspan" = "v0.2.0"
"github.com/martian56/raven-toml" = "v0.3.0"

[dist]
display_name = "dusk"
description = "A terminal code editor with modal and everyday key bindings, mouse support, and plugins, written in Raven"
license = "MIT"
homepage = "https://github.com/martian56/dusk"
maintainer = "martian56 <fuadelizade469@gmail.com>"
vendor = "martian56"

[[dist.assets]]
source = "README.md"
dest = "share/doc/dusk/README.md"

[[dist.assets]]
source = "LICENSE"
dest = "share/doc/dusk/LICENSE"

[dist.windows]
upgrade_code = "1e1495ab-c151-4c50-8a12-958759dd58a0"
add_to_path = true
