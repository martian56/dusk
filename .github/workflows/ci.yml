name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Raven
        uses: martian56/setup-raven@v1
        with:
          raven-version: "3.3.3"

      - name: Build
        run: rvpm build --workspace

      - name: Test
        run: rvpm test

      - name: Smoke test
        shell: bash
        run: |
          dusk=target/raven-out/dusk
          [ -f "$dusk.exe" ] && dusk="$dusk.exe"
          "$dusk" --version
          printf 'fun main() {\n}\n' > smoke.rv
          "$dusk" --keys "A<cr>print(1)<esc>:w<cr>" smoke.rv
          grep -q "    print(1)" smoke.rv
          "$dusk" --keys "" --size 80x10 --screen smoke.rv | grep -q "NORMAL"

      - name: Format check
        run: rvpm fmt --check

      - name: Documentation
        run: rvpm doc
